<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detection Result</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --border:#2a2f3a; --accent:#ff4d4f; --accent2:#2ecc71; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 28px 40px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size: 22px; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; margin-bottom:24px; }
  video { width:100%; border-radius:8px; border:1px solid var(--border); }
  .stats { display:flex; gap:24px; flex-wrap:wrap; margin-top:20px; }
  .stat { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:14px 20px; min-width:150px; }
  .stat .val { font-size:22px; font-weight:700; }
  .stat .lab { font-size:12px; color:var(--muted); margin-top:4px; }
  .verdict { padding:14px 18px; border-radius:8px; font-weight:600; margin-top:20px; }
  .verdict.violence { background:#3d1f1f; color:#ff8a8a; border:1px solid var(--accent); }
  .verdict.clean { background:#122a1c; color:#8ef0b5; border:1px solid var(--accent2); }
  a.back { color:var(--muted); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<header><h1>🚁 Detection Result</h1></header>
<div class="container">
  <a class="back" href="/">&larr; Back</a>
  <div class="card" style="margin-top:16px;">
    <video controls autoplay muted>
      <source src="{{ url_for('output_file', filename=video_file) }}" type="video/mp4">
    </video>

    <div class="verdict {{ 'violence' if 'DETECTED' in stats.verdict else 'clean' }}">
      {{ stats.verdict }}
    </div>

    <div class="stats">
      <div class="stat"><div class="val">{{ stats.total_frames }}</div><div class="lab">Total frames</div></div>
      <div class="stat"><div class="val">{{ stats.violence_frames }}</div><div class="lab">Violence frames</div></div>
      <div class="stat"><div class="val">{{ (stats.violence_ratio * 100) | round(1) }}%</div><div class="lab">Violence ratio</div></div>
    </div>
  </div>
</div>
</body>
</html>
